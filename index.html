  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    a-scene, a-scene canvas {
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
    }
  </style>
  <script>
    // Camera vertical movement using Q/E keys.
    AFRAME.registerComponent('qe-fly', {
      schema: { speed: { default: 4 } },
      init: function () {
        this.keys = { q: false, e: false };
        this.onKeyDown = (evt) => {
          const key = evt.key.toLowerCase();
          if (key === 'q' || key === 'e') this.keys[key] = true;
        };
        this.onKeyUp = (evt) => {
          const key = evt.key.toLowerCase();
          if (key === 'q' || key === 'e') this.keys[key] = false;
        };
        window.addEventListener('keydown', this.onKeyDown);
        window.addEventListener('keyup', this.onKeyUp);
      },
      tick: function (_time, deltaMs) {
        const dt = deltaMs / 1000;
        const deltaY = (this.keys.e ? 1 : 0) - (this.keys.q ? 1 : 0);
        if (!deltaY) return;
        this.el.object3D.position.y += deltaY * this.data.speed * dt;
      },
      remove: function () {
        window.removeEventListener('keydown', this.onKeyDown);
        window.removeEventListener('keyup', this.onKeyUp);
      }
    });

    // Subtle wave motion for pool water surface.
    AFRAME.registerComponent('pool-water-motion', {
      schema: {
        amplitude: { default: 0.045 },
        speed: { default: 0.0016 },
        tilt: { default: 0.75 }
      },
      init: function () {
        this.baseY = this.el.object3D.position.y;
      },
      tick: function (time) {
        const t = time * this.data.speed;
        this.el.object3D.position.y = this.baseY + Math.sin(t) * this.data.amplitude;
        this.el.object3D.rotation.x = Math.sin(t * 0.9) * (this.data.tilt * Math.PI / 180);
        this.el.object3D.rotation.z = Math.cos(t * 0.7) * (this.data.tilt * Math.PI / 180);
      }
    });

    // Live date/time label for fridge display.
    AFRAME.registerComponent('live-datetime', {
      schema: { mode: { default: 'time' } },
      init: function () {
        this.lastSecond = -1;
      },
      tick: function () {
        const now = new Date();
        const sec = now.getSeconds();
        if (sec === this.lastSecond) return;
        this.lastSecond = sec;
        let value;
        if (this.data.mode === 'date') {
          value = now.toLocaleDateString();
        } else if (this.data.mode === 'weekday') {
          value = now.toLocaleDateString([], { weekday: 'long' }).toUpperCase();
        } else {
          value = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        this.el.setAttribute('value', value);
      }
    });

    // Fit a loaded glTF model to an exact footprint while preserving chosen height scale.
    AFRAME.registerComponent('fit-gltf-footprint', {
      schema: {
        width: { default: 1 },
        depth: { default: 1 },
        yScale: { default: 1 }
      },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;

          const box = new THREE.Box3().setFromObject(obj);
          const size = new THREE.Vector3();
          box.getSize(size);
          if (!size.x || !size.z) return;

          const sx = this.data.width / size.x;
          const sz = this.data.depth / size.z;
          this.el.object3D.scale.set(sx, this.data.yScale, sz);
        });
      }
    });

    // Prevent browser-level image/text drag behavior on A-Frame canvas.
    window.addEventListener('DOMContentLoaded', () => {
      const sceneEl = document.querySelector('a-scene');
      if (!sceneEl) return;

      const lockCanvasInteraction = () => {
        const canvas = sceneEl.canvas;
        if (!canvas) return;
        canvas.setAttribute('draggable', 'false');
        canvas.addEventListener('dragstart', (evt) => evt.preventDefault());
        canvas.addEventListener('dblclick', (evt) => evt.preventDefault());
      };

      sceneEl.addEventListener('render-target-loaded', lockCanvasInteraction);
      if (sceneEl.hasLoaded) lockCanvasInteraction();
    });
  </script>
